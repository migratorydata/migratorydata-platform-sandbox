apiVersion: v1
kind: Service
metadata:
  namespace: migratorydata
  name: migratorydata-server-external
  labels:
    app: migratorydata
spec:
  type: LoadBalancer
  ports:
    - name: client-port
      port: 8800
      protocol: TCP
      targetPort: 8800
  selector:
    app: migratorydata
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: migratorydata-server-config
  namespace: migratorydata
  labels:
    app: migratorydata
data:
  migratorydata.conf: |
    # A string representing the license key issued by MigratoryData for evaluation, development, or production usage. Required.
    LicenseKey = zczuvikp41d2jb2o7j6n

    # Specifies the maximum memory (in megabytes) to be used by the JVM (-Xmx). In production, use at least 8192 MB. Required.
    Memory = 128MB

    # A comma-separated list of addresses to listen for client connections (format: IP:Port or DNS:Port). Wildcard * binds to all interfaces. Optional.
    Listen = *:8800

    # The verbosity level of the logs. Available levels: TRACE, DEBUG, INFO (recommended), WARN, ERROR. Default: INFO. Optional.
    LogLevel=INFO
    # The maximum size of a log file before rotation. Expressed in KB, MB, or GB. Default: 10 MB. Optional.
    LogRotateLimit = 10 MB
    # The folder where the logs will be written. Default: logs (relative to the start directory). Optional.
    LogFolder = logs

    # Folder from which MigratoryData will serve static files. Default: html. For development use only; use Nginx/Apache in production. Optional.
    DocumentRoot = html

    # Specifies the entitlement type: None, Basic, JWT, Custom, or Portal. When set to Portal, use Portal.Url and Portal.Password. Default: Basic. Optional.
    Entitlement=Portal
    # The URL of the MigratoryData Portal instance. The Server connects here to retrieve entitlement and configuration data. Required if Entitlement=Portal.
    Portal.Url = http://migratorydata-portal-internal:8080
    # The password used by the Server to authenticate with the Portal. Must match portal.gateway.access.password in the Portal config. Required if Entitlement=Portal.
    Portal.Password = my-password

    # Enables the built-in REST API for publishing messages via HTTP. Default: false. Optional.
    Rest.Enable = true

    # Time interval in seconds at which system statistics are logged. Minimum value: 5. Default: 60. Optional.
    Stats.LogInterval=5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: migratorydata-server
  namespace: migratorydata
spec:
  selector:
    matchLabels:
      app: migratorydata
  replicas: 1 # Desired number of cluster nodes
  template:
    metadata:
      labels:
        app: migratorydata
    spec:
      containers:
        - name: migratorydata-cluster
          imagePullPolicy: Always
          image: migratorydata/server:6.0.24
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MIGRATORYDATA_GATEWAY_EXTRA_OPTS
              value: "-DNodeName=$(NODE_NAME)"
            - name: MIGRATORYDATA_GATEWAY_JAVA_GC_LOG_OPTS
              value: "-XX:+PrintCommandLineFlags -XX:+PrintGC -XX:+PrintGCDetails -XX:+DisableExplicitGC -Dsun.rmi.dgc.client.gcInterval=0x7ffffffffffffff0 -Dsun.rmi.dgc.server.gcInterval=0x7ffffffffffffff0 -verbose:gc"
          resources:
            requests:
              memory: "256Mi"
              cpu: "0.5"
          ports:
            - name: client-port
              containerPort: 8800
          readinessProbe:
            tcpSocket:
              port: 8800
            initialDelaySeconds: 20
            failureThreshold: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8800
            initialDelaySeconds: 10
            failureThreshold: 5
            periodSeconds: 5
          volumeMounts:
          - name: config-volume
            mountPath: /migratorydata/migratorydata.conf
            subPath: migratorydata.conf
      volumes:
      - name: config-volume
        configMap:
          name: migratorydata-server-config
          items:
          - key: migratorydata.conf
            path: migratorydata.conf
      restartPolicy: Always