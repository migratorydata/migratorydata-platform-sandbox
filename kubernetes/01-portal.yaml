apiVersion: v1
kind: Service
metadata:
  namespace: migratorydata
  name: migratorydata-portal-external
  labels:
    app: migratorydata-portal
spec:
  type: LoadBalancer
  ports:
    - name: portal-port
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app: migratorydata-portal
---
apiVersion: v1
kind: Service
metadata:
  name: migratorydata-portal-internal
  namespace: migratorydata
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: migratorydata-portal
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: migratorydata-portal-sqlite-pvc
  namespace: migratorydata
  labels:
    app: migratorydata-portal
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path # Adjust based on your cluster's storage classes
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: migratorydata-portal-config
  namespace: migratorydata
  labels:
    app: migratorydata-portal
data:
  migratorydata-portal.conf: |
    # Specifies the maximum memory (in megabytes) to be used by the JVM (-Xmx). Default: 128 MB. Required.
    memory=512 MB

    # Folder where logs will be written. Default: logs (relative to start directory). Optional.
    log.folder=logs


    # IP address for the portal to listen on. Default: 0.0.0.0. Optional.
    portal.listen.ip=0.0.0.0
    
    # Port for the portal to listen on. Default: 8080. Optional.
    portal.listen.port=8080

    # Email of the administrator account created on first startup. Required at startup.
    portal.admin.email=admin@admin.com
    
    # Password for the default admin user. Required at startup.
    portal.admin.password=password
    
    # Default organization for the admin account. If not set, a default organization is created automatically. Optional.
    portal.admin.organization=migratorydata
    
    # Enable or disable email verification for new users. Set to true to require verification. Default: false. Optional.
    portal.verifyEmail=false

    # Public URL of the portal used in emails and links sent to users. Optional.
    portal.url=http://migratorydata-portal-external:8080
    
    # Password used by the Gateway to authenticate with the Portal for retrieving configs, sending logs and stats. Required.
    portal.gateway.access.password=my-password


    # Enables demo APIs for testing and onboarding. Must be disabled in production. Default: true. Optional.
    demo.apis = true
    
    # Key used by the Portal and client SDKs to authorize demo operations without a full user account. Optional.
    demo.key = g4hD1hIgPDpcD//R22XFWXVEgt38Z5KI3QS9jHlnLnk=


    # Path to the SQLite database file or database name for MySQL/PostgreSQL. Default: ./data/push-cloud.db. Required.
    db.name=./data/migratorydata-portal.db

    # Type of database backend. Supported values: sqlite, mysql, postgres. Default: sqlite. Required.
    db.type=sqlite

    # Fully qualified class name of the JDBC driver (sqlite: org.sqlite.JDBC, mysql: com.mysql.cj.jdbc.Driver, postgres: org.postgresql.Driver). Required.
    db.driver.classpath=org.sqlite.JDBC


    # List of Gateway server addresses used by the Portal for debug console, demo features, and client SDK code generation. Required.
    gateway.servers=127.0.0.1:8800

    # Determines whether the Portal connects to Gateway servers using TLS. Default: true. Optional.
    gateway.tls.enabled=false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: migratorydata-portal
  namespace: migratorydata
  labels:
    app: migratorydata-portal
spec:
  replicas: 1  # Single pod 
  selector:
    matchLabels:
      app: migratorydata-portal
  template:
    metadata:
      labels:
        app: migratorydata-portal
    spec:
      containers:
      - name: migratorydata-portal
        image: migratorydata/portal:1.0.4
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: sqlite-storage
          mountPath: /data
        - name: config-volume
          mountPath: /migratorydata-portal/migratorydata-portal.conf
          subPath: migratorydata-portal.conf
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 5
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 5
      volumes:
      - name: sqlite-storage
        persistentVolumeClaim:
          claimName: migratorydata-portal-sqlite-pvc
      - name: config-volume
        configMap:
          name: migratorydata-portal-config
          items:
          - key: migratorydata-portal.conf
            path: migratorydata-portal.conf
      restartPolicy: Always