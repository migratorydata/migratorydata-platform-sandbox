# memory (Required, default: 128 MB)
# Maximum heap memory allocated to the JVM running the Kafkorama Portal,
# expressed in megabytes. For production workloads, increase this value
# based on the number of connected users and message volume.
# Ref: https://kafkorama.com/docs/portal/config/#memory
memory=512MB

# log.folder (Optional, default: logs)
# Directory where log files are written. Relative paths are resolved from the
# Portal startup directory. Absolute paths are also supported:
#   log.folder = /some/path/mylogs   (Linux/Unix)
#   log.folder = C:/some/path/mylogs (Windows)
# Ref: https://kafkorama.com/docs/portal/config/#logfolder
log.folder=logs

# portal.listen.ip (Optional, default: 0.0.0.0)
# IP address on which the Portal listens for incoming HTTP requests.
# 0.0.0.0 binds to all available network interfaces.
# Ref: https://kafkorama.com/docs/portal/config/#portallistenip
portal.listen.ip=0.0.0.0

# portal.listen.port (Optional, default: 8080)
# TCP port on which the Portal listens for incoming HTTP requests.
# Ref: https://kafkorama.com/docs/portal/config/#portallistenport
portal.listen.port=8080

# portal.url (Optional)
# Public base URL of the Portal, used in email notifications and generated links
# sent to users (e.g., password resets, invitations). In Docker Compose,
# this should point to the host-accessible address, not the service name.
# Ref: https://kafkorama.com/docs/portal/config/#portalurl
portal.url=http://127.0.0.1:8080

# portal.gateway.access.password (Required)
# Shared secret used by the Kafkorama Gateway (MigratoryData server) to
# authenticate with this Portal when retrieving cluster configuration, expired
# token lists, and when uploading logs and stats. Must match Portal.Password in
# the MigratoryData server configuration (migratorydata.conf).
# Ref: https://kafkorama.com/docs/portal/config/#portalgatewayaccesspassword
portal.gateway.access.password=my-password

# portal.admin.email (Required at startup)
# Email address of the default administrator account created when the Portal
# starts for the first time.
# Ref: https://kafkorama.com/docs/portal/config/#portaladminemail
portal.admin.email=admin@admin.com

# portal.admin.password (Required at startup)
# Password for the administrator account defined by portal.admin.email.
# Change this to a strong password before exposing the Portal publicly.
# Ref: https://kafkorama.com/docs/portal/config/#portaladminpassword
portal.admin.password=password

# portal.admin.organization (Optional)
# Name of the organization assigned to the administrator account at startup.
# If not set, a default organization is created automatically.
# Ref: https://kafkorama.com/docs/portal/config/#portaladminorganization
portal.admin.organization=migratorydata

# portal.verifyEmail (Optional, default: false)
# Set to true to require email verification for newly registered users.
# Requires SMTP settings to be configured when enabled.
# Ref: https://kafkorama.com/docs/portal/config/#portalverifyemail
portal.verifyEmail=false

# ---------------------------------------------------------------------------
# Gateway Integration
# ---------------------------------------------------------------------------

# gateway.servers (Required)
# Comma-separated list of MigratoryData Gateway server addresses (host:port).
# Used by the Portal debug console, live demo features, and client SDK code
# generation to connect clients to the Gateway cluster.
# Ref: https://kafkorama.com/docs/portal/config/#gatewayservers
gateway.servers=127.0.0.1:8800

# gateway.tls.enabled (Optional, default: true)
# Determines whether the Portal connects to the Gateway using TLS.
# Set to false for local/demo deployments without TLS certificates.
# Ref: https://kafkorama.com/docs/portal/config/#gatewaytlsenabled
gateway.tls.enabled=false

# gateway.auth.signature.type (Optional, default: hmac)
# Signature algorithm used to generate client authentication tokens.
# Supported values:
#   hmac - HMAC-based signatures (requires gateway.auth.signature.hmac.secret)
#   rsa  - RSA-based signatures  (requires gateway.auth.signature.rsa.publicKeyPath)
# Ref: https://kafkorama.com/docs/portal/config/#gatewayauthsignaturetype
gateway.auth.signature.type=hmac

# gateway.auth.signature.hmac.secret (Required when signature type is hmac)
# Secret key used to generate HMAC signatures for client authentication tokens.
# Keep this value secret; rotate it if compromised.
# Ref: https://kafkorama.com/docs/portal/config/#gatewayauthsignaturehmac-secret
gateway.auth.signature.hmac.secret=He39zDQW7RdkOcxe3L9qvoSQ/ef40BG6Ro4hrHDjE+U=

# ---------------------------------------------------------------------------
# Demo Settings
# ---------------------------------------------------------------------------

# demo.apis (Optional, default: true)
# Activates the built-in demo APIs for exploring Portal features.
# WARNING: Must be disabled in production environments.
# Ref: https://kafkorama.com/docs/portal/config/#demoapis
demo.apis = true

# demo.key (Optional)
# Authorization key used by the Portal and client SDKs to authorize demo
# operations without requiring a full user account.
# Ref: https://kafkorama.com/docs/portal/config/#demokey
demo.key = g4hD1hIgPDpcD//R22XFWXVEgt38Z5KI3QS9jHlnLnk=

# ---------------------------------------------------------------------------
# Database Settings
# ---------------------------------------------------------------------------

# db.name (Required, default: ./data/push-cloud.db)
# Path to the SQLite database file, or the database name for MySQL/PostgreSQL.
# Ref: https://kafkorama.com/docs/portal/config/#dbname
db.name=./data/migratorydata-portal.db

# db.type (Required, default: sqlite)
# Database backend type. Supported values:
#   sqlite   - Local file-based database (no server required)
#   mysql    - Remote MySQL server
#   postgres - Remote PostgreSQL server
# Ref: https://kafkorama.com/docs/portal/config/#dbtype
db.type=sqlite

# db.driver.classpath (Required)
# Fully qualified class name of the JDBC driver for the selected db.type.
#   SQLite:     org.sqlite.JDBC
#   MySQL:      com.mysql.cj.jdbc.Driver
#   PostgreSQL: org.postgresql.Driver
# Ref: https://kafkorama.com/docs/portal/config/#dbdriverclasspath
db.driver.classpath=org.sqlite.JDBC

# db.user / db.password (Required for MySQL/PostgreSQL, default: root / empty)
# Credentials used to authenticate with the database server.
# Not required for SQLite.
# Ref: https://kafkorama.com/docs/portal/config/#dbuser--dbpassword
db.user=root
db.password=

# db.ip / db.port (Required for MySQL/PostgreSQL, default: 127.0.0.1 / 3306)
# Network address and port of the database server.
# Ignored when db.type is sqlite.
# Ref: https://kafkorama.com/docs/portal/config/#dbip--dbport
db.ip=127.0.0.1
db.port=3306

# db.ssl (Optional, default: false)
# When set to true, the database connection uses SSL/TLS.
# Relevant for MySQL/PostgreSQL deployments.
# Ref: https://kafkorama.com/docs/portal/config/#dbssl
db.ssl=false
