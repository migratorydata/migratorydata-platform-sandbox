# LicenseKey (Required)
# A string representing the license key issued by MigratoryData for evaluation,
# development, or production use. Contact support@migratorydata.com to obtain one.
# Ref: https://migratorydata.com/docs/server/configuration/core-parameters/#licensekey
LicenseKey = zczuvikp41d2jb2o7j6n

# Memory (Required)
# Maximum memory allocated to the MigratoryData server, expressed in MB.
# For production workloads it is recommended to use at least 8192 MB (8 GB)
# depending on the number of connected clients and data throughput.
# Ref: https://migratorydata.com/docs/server/configuration/core-parameters/#memory
Memory = 128MB

# Listen (Optional)
# Comma-separated list of IP:Port addresses on which the server accepts plain
# (unencrypted) client connections. The wildcard address (*) binds to all
# available network interfaces. If no port is given, port 80 is used by default.
# Ref: https://migratorydata.com/docs/server/configuration/core-parameters/#listen
Listen = *:8800

# LogLevel (Optional, default: INFO)
# Controls the verbosity of server logs.
# Available levels (most to least verbose): TRACE, DEBUG, INFO, WARN, ERROR.
# INFO is the recommended level for production use.
# Ref: https://migratorydata.com/docs/server/configuration/core-parameters/#loglevel
LogLevel=INFO

# LogRotateLimit (Optional, default: 10 MB)
# Maximum size of a single log file. Supported units: GB, MB, KB.
# When the limit is reached, MigratoryData automatically starts a new log file.
# Previous log files are retained up to the count defined by LogRotateFileCount.
# Ref: https://migratorydata.com/docs/server/configuration/core-parameters/#logrotatelimit
LogRotateLimit = 10 MB

# LogFolder (Optional, default: logs)
# Directory where log files are written. Relative paths are resolved from the
# MigratoryData installation directory. Absolute paths are also supported.
# Ref: https://migratorydata.com/docs/server/configuration/core-parameters/#logfolder
LogFolder = logs

# DocumentRoot (Optional, default: html)
# Directory from which MigratoryData serves static files. This feature is
# intended for development only. In production, use a dedicated web server
# (e.g., Nginx or Apache) and disable or omit this parameter.
# Ref: https://migratorydata.com/docs/server/configuration/core-parameters/#documentroot
DocumentRoot = html

# Entitlement (Optional, default: Basic)
# Defines the access-control model for client subscriptions and publications.
# Supported values:
#   None    - Any client may subscribe and publish on any subject.
#   Basic   - Any client may subscribe; publication requires the token defined
#             by EntitlementAllowToken.
#   JWT     - Clients are authorized via JWT tokens (MigratoryData JWT add-on).
#   Custom  - Authorization is delegated to a custom Server Extensions API plugin.
#   Portal  - Authorization is delegated to the MigratoryData Portal (see Portal.*
#             parameters below).
# Ref: https://migratorydata.com/docs/server/configuration/core-parameters/#entitlement
Entitlement=Portal

# Portal.Url (Required when Entitlement=Portal)
# Base URL of the MigratoryData Portal that the server contacts to validate
# client tokens and retrieve cluster configuration. When running inside Docker
# Compose, use the service name as the hostname.
Portal.Url = http://migratorydata-portal:8080

# Portal.Password (Required when Entitlement=Portal)
# Shared secret used by the MigratoryData server to authenticate against the
# Portal. Must match the value of gateway.access.password in the Portal
# configuration file (migratorydata-portal.conf).
Portal.Password = my-password

# Rest.Enable (Optional, default: false)
# Set to true to enable the built-in REST API, which allows publishing messages
# to subjects via HTTP POST requests without a persistent WebSocket connection.
Rest.Enable = true

# Name of the node in the MigratoryData cluster. This is used for logging and monitoring purposes.
NodeName = migratorydata-server

# Time interval in seconds at which system statistics are logged. Minimum value: 5. Default: 60. Optional.
Stats.LogInterval=5
